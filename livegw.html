<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live GW Table | Sagarmatha League</title>
<meta name="description" content="Live gameweek standings for the Sagarmatha League.">
<meta name="theme-color" content="#0b2a6f">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="hero">
    <img src="images/Flag_of_Nepal.gif" alt="Flag of Nepal" class="flag">
    <h1 id="leagueName">Sagarmatha League</h1>
    <p>Live Gameweek Standings</p>
</header>

<nav class="navbar">
    <a href="index.html">Dashboard</a>
    <a href="livegw.html" class="active">Live GW Table</a>
    <a href="managers.html">Manager Stats</a>
    <a href="rules.html">FPL Rules</a>
</nav>

<div class="container">

    <div class="cards" id="liveSummary">
        <div class="card">Loading...</div>
    </div>

    <h2 id="liveGWTitle" class="section-title">Live GW Standings</h2>

    <div class="live-toolbar">
        <input
            type="search"
            id="liveSearch"
            class="live-search"
            placeholder="Search team or manager"
            aria-label="Search team or manager"
            autocomplete="off">
        <span id="liveUpdated" class="live-updated">Loading...</span>
    </div>

    <div class="chip-legend">
        <span><span class="chip-badge chip-bb">BB</span>Bench Boost</span>
        <span><span class="chip-badge chip-tc">TC</span>Triple Captain</span>
        <span><span class="chip-badge chip-wc">WC</span>Wildcard</span>
        <span><span class="chip-badge chip-fh">FH</span>Free Hit</span>
    </div>

    <div class="table-container">

        <table class="analytics-table live-table">

            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Team</th>
                    <th>Manager</th>
                    <th>GW Pts</th>
                </tr>
            </thead>

            <tbody id="liveGWTable">
                <tr>
                    <td colspan="4">Loading...</td>
                </tr>
            </tbody>

        </table>

    </div>

</div>

<footer class="site-footer">
    Hero photo: Mount Everest north face by
    <a href="https://commons.wikimedia.org/wiki/File:Everest_North_Face_toward_Base_Camp_Tibet_Luca_Galuzzi_2006.jpg">Luca Galuzzi</a>,
    <a href="https://creativecommons.org/licenses/by-sa/2.5/">CC BY-SA 2.5</a>
</footer>

<script src="livegw.js"></script>

</body>

</html>
