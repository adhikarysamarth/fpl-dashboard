<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sagarmatha League</title>

<style>

body{
    margin:0;
    background:#071225;
    color:white;
    font-family:Segoe UI,Arial,sans-serif;
}

header{
    background:linear-gradient(135deg,#49005c,#00ff87);
    padding:25px;
    text-align:center;
}

h1{
    margin:0;
}

.container{
    padding:20px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.card{
    background:#13203b;
    border-radius:12px;
    padding:20px;
}

.card h3{
    margin-top:0;
    color:#00ff87;
}

.card-value{
    font-size:28px;
    font-weight:bold;
}

table{
    width:100%;
    border-collapse:collapse;
    background:#13203b;
}

th{
    background:#4a005d;
    color:white;
    padding:12px;
}

td{
    padding:12px;
    border-bottom:1px solid #243451;
    text-align:center;
}

tr:hover{
    background:#1b2c4d;
}

.gold{
    background:rgba(255,215,0,.12);
}

.silver{
    background:rgba(192,192,192,.12);
}

.bronze{
    background:rgba(205,127,50,.12);
}

.up{
    color:#00ff87;
    font-weight:bold;
}

.down{
    color:#ff7373;
    font-weight:bold;
}

.same{
    color:#ddd;
}

</style>

</head>

<body>

<header>
    <h1 id="leagueName">Loading...</h1>
</header>

<div class="container">

<div class="cards">

    <div class="card">
        <h3>Current Leader</h3>
        <div id="leader" class="card-value">-</div>
    </div>

    <div class="card">
        <h3>Manager Of The Week</h3>
        <div id="gwWinner" class="card-value">-</div>
    </div>

    <div class="card">
        <h3>League Members</h3>
        <div id="members" class="card-value">-</div>
    </div>

    <div class="card">
        <h3>Your Team</h3>
        <div id="myTeam">-</div>
    </div>

</div>

<h2>League Table</h2>

<table>

<thead>
<tr>
    <th>Rank</th>
    <th>Move</th>
    <th>Team</th>
    <th>Manager</th>
    <th>GW Points</th>
    <th>Total Points</th>
</tr>
</thead>

<tbody id="tableBody">
<tr>
<td colspan="6">Loading league data...</td>
</tr>
</tbody>

</table>

</div>

<script>

fetch("https://fpl-api.adhikarysamarth.workers.dev/")
.then(res => res.json())
.then(data => {

    console.log(data);

    const leagueName =
        data.league.league.name;

    const teams =
        data.league.standings.results;

    document.getElementById("leagueName").innerText =
        leagueName;

    const leader = teams[0];

    document.getElementById("leader").innerHTML =
        leader.entry_name +
        "<br><small>" +
        leader.total +
        " pts</small>";

    const winner = teams.reduce((a,b)=>
        a.event_total > b.event_total
        ? a
        : b
    );

    document.getElementById("gwWinner").innerHTML =
        winner.entry_name +
        "<br><small>" +
        winner.event_total +
        " pts</small>";

    document.getElementById("members").innerText =
        teams.length;

    const samarth = teams.find(
        team => team.player_name === "Samarth Adhikary"
    );

    if(samarth){

        document.getElementById("myTeam").innerHTML =
        "<strong>" + samarth.entry_name + "</strong><br>" +
        "Rank: " + samarth.rank + "<br>" +
        "Points: " + samarth.total;
    }

    let html = "";

    teams.forEach(team => {

        let move = "▬";
        let moveClass = "same";

        if(team.rank < team.last_rank){
            move = "▲";
            moveClass = "up";
        }

        if(team.rank > team.last_rank){
            move = "▼";
            moveClass = "down";
        }

        let rowClass = "";

        if(team.rank === 1){
            rowClass = "gold";
        }

        if(team.rank === 2){
            rowClass = "silver";
        }

        if(team.rank === 3){
            rowClass = "bronze";
        }

        html += `
        <tr class="${rowClass}">

            <td>${team.rank}</td>

            <td class="${moveClass}">
                ${move}
            </td>

            <td>${team.entry_name}</td>

            <td>${team.player_name}</td>

            <td>${team.event_total}</td>

            <td>${team.total}</td>

        </tr>
        `;
    });

    document.getElementById("tableBody").innerHTML =
        html;

})
.catch(error => {

    console.log(error);

    document.getElementById("tableBody").innerHTML =
    `
    <tr>
        <td colspan="6">
            Error loading FPL data.
        </td>
    </tr>
    `;

});

</script>

</body>
</html>
