<!DOCTYPE html>
<html>
<head>
    <title>Sagarmatha League</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            margin:40px;
            background:#f5f7fa;
        }

        h1{
            text-align:center;
            color:#37003c;
        }

        .cards{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
            gap:20px;
            margin-bottom:30px;
        }

        .card{
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 2px 8px rgba(0,0,0,.1);
        }

        .card h3{
            margin-top:0;
            color:#37003c;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
        }

        th{
            background:#37003c;
            color:white;
            padding:12px;
        }

        td{
            padding:12px;
            border-bottom:1px solid #ddd;
            text-align:center;
        }

        tr:hover{
            background:#f3f3f3;
        }

        .leader{
            font-weight:bold;
            color:green;
        }

    </style>
</head>

<body>

<h1 id="leagueName">Loading...</h1>

<div class="cards">

    <div class="card">
        <h3>Current Leader</h3>
        <div id="leader">Loading...</div>
    </div>

    <div class="card">
        <h3>Latest GW Winner</h3>
        <div id="gwWinner">Loading...</div>
    </div>

    <div class="card">
        <h3>League Members</h3>
        <div id="members">Loading...</div>
    </div>

    <div class="card">
        <h3>Last Updated</h3>
        <div id="updated">Loading...</div>
    </div>

</div>

<h2>League Table</h2>

<table>
<thead>
<tr>
    <th>Rank</th>
    <th>Team</th>
    <th>Manager</th>
    <th>GW Points</th>
    <th>Total Points</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>

</table>

<script>

fetch("https://fpl-api.adhikarysamarth.workers.dev/")
.then(response => response.json())
.then(data => {

    document.getElementById("leagueName").innerText =
        data.league.name;

    const teams = data.standings.results;

    const leader = teams[0];

    document.getElementById("leader").innerHTML =
        `
        <strong>${leader.entry_name}</strong><br>
        ${leader.player_name}<br>
        ${leader.total} pts
        `;

    const gwWinner = teams.reduce((highest,current)=>
        current.event_total > highest.event_total
        ? current
        : highest
    );

    document.getElementById("gwWinner").innerHTML =
        `
        <strong>${gwWinner.entry_name}</strong><br>
        ${gwWinner.event_total} points
        `;

    document.getElementById("members").innerText =
        teams.length;

    document.getElementById("updated").innerText =
        new Date(data.last_updated_data)
        .toLocaleString();

    let html = "";

    teams.forEach(team => {

        html += `
        <tr>

            <td>${team.rank}</td>

            <td>
                ${team.entry_name}
            </td>

            <td>
                ${team.player_name}
            </td>

            <td>
                ${team.event_total}
            </td>

            <td>
                ${team.total}
            </td>

        </tr>
        `;
    });

    document.getElementById("tableBody")
        .innerHTML = html;

})
.catch(error => {

    console.error(error);

    document.body.innerHTML +=
        "<h3 style='color:red'>Unable to load data</h3>";

});

</script>

</body>
</html>
