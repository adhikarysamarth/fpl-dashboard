<!DOCTYPE html>
<html>
<head>
    <title>Sagarmatha League</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: auto;
            padding: 20px;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        .cards {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            flex: 1;
            min-width: 200px;
            box-shadow: 0 2px 5px rgba(0,0,0,.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th {
            background: #37003c;
            color: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
        }

        tr:nth-child(even){
            background:#f8f8f8;
        }
    </style>
</head>

<body>

<h1 id="leagueName">Loading...</h1>

<div class="cards">

    <div class="card">
        <h3>Current Leader</h3>
        <div id="leader"></div>
    </div>

    <div class="card">
        <h3>Latest GW Winner</h3>
        <div id="gwWinner"></div>
    </div>

    <div class="card">
        <h3>League Members</h3>
        <div id="members"></div>
    </div>

    <div class="card">
        <h3>Last Updated</h3>
        <div id="updated"></div>
    </div>

</div>

<h2>League Table</h2>

<table>
    <thead>
        <tr>
            <th>Rank</th>
            <th>Team</th>
            <th>Manager</th>
            <th>GW Points</th>
            <th>Total Points</th>
        </tr>
    </thead>

    <tbody id="leagueTable">

    </tbody>
</table>

<script>

const leagueData = YOUR_JSON_OBJECT_HERE;

document.getElementById("leagueName").innerText =
    leagueData.league.name;

const results = leagueData.standings.results;

const leader = results[0];

document.getElementById("leader").innerHTML =
    `<strong>${leader.entry_name}</strong><br>
    ${leader.total} pts`;

const gwWinner = results.reduce((a,b)=>
    a.event_total > b.event_total ? a : b
);

document.getElementById("gwWinner").innerHTML =
    `<strong>${gwWinner.entry_name}</strong><br>
    ${gwWinner.event_total} pts`;

document.getElementById("members").innerText =
    results.length;

document.getElementById("updated").innerText =
    new Date(leagueData.last_updated_data)
    .toLocaleString();

const table = document.getElementById("leagueTable");

results.forEach(team => {

    table.innerHTML += `
        <tr>
            <td>${team.rank}</td>
            <td>${team.entry_name}</td>
            <td>${team.player_name}</td>
            <td>${team.event_total}</td>
            <td>${team.total}</td>
        </tr>
    `;

});

</script>

</body>
</html>
