<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sagarmatha League</title>

<style>

body{
    margin:0;
    font-family:Segoe UI,sans-serif;
    background:#0b1220;
    color:white;
}

header{
    background:linear-gradient(135deg,#37003c,#00ff87);
    padding:30px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:42px;
}

.container{
    padding:25px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:25px;
}

.card{
    background:#141d2f;
    border-radius:12px;
    padding:20px;
    box-shadow:0 4px 10px rgba(0,0,0,.4);
}

.card h3{
    margin-top:0;
    color:#00ff87;
}

.card-value{
    font-size:22px;
    font-weight:bold;
}

table{
    width:100%;
    border-collapse:collapse;
    background:#141d2f;
}

th{
    background:#37003c;
    color:white;
    padding:14px;
}

td{
    padding:12px;
    text-align:center;
    border-bottom:1px solid #23304d;
}

tr:hover{
    background:#1c2840;
}

.gold{
    background:rgba(255,215,0,.15);
}

.silver{
    background:rgba(192,192,192,.15);
}

.bronze{
    background:rgba(205,127,50,.15);
}

.up{
    color:#00ff87;
    font-weight:bold;
}

.down{
    color:#ff5858;
    font-weight:bold;
}

.same{
    color:#dddddd;
}

.loading{
    text-align:center;
    padding:50px;
}

</style>
</head>

<body>

<header>
    <h1 id="leagueName">Loading...</h1>
</header>

<div class="container">

<div class="cards">

    <div class="card">
        <h3>Current Leader</h3>
        <div class="card-value" id="leader">-</div>
    </div>

    <div class="card">
        <h3>Manager of the Week</h3>
        <div class="card-value" id="gwWinner">-</div>
    </div>

    <div class="card">
        <h3>League Members</h3>
        <div class="card-value" id="members">-</div>
    </div
