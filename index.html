<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Sagarmatha League</title>

<style>

body{
    margin:0;
    background:#071225;
    color:white;
    font-family:Segoe UI,sans-serif;
}

header{
    background:linear-gradient(135deg,#4b006e,#00ff87);
    padding:30px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:48px;
}

.container{
    padding:20px;
}

.last-updated{
    position:fixed;
    top:15px;
    right:20px;
    background:rgba(0,0,0,.4);
    backdrop-filter:blur(8px);
    padding:10px 15px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.15);
    z-index:1000;
    text-align:right;
    font-size:12px;
}

.last-updated span{
    color:#00ff87;
    font-weight:bold;
    display:block;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.card{
    background:#13203b;
    border-radius:12px;
    padding:20px;
}

.card h3{
    margin-top:0;
    color:#00ff87;
}

.big{
    font-size:24px;
    font-weight:bold;
}

#countdown{
    color:#00ff87;
    font-size:20px;
    margin-top:10px;
    font-weight:bold;
}

table{
    width:100%;
    border-collapse:collapse;
    background:#13203b;
}

th{
    background:#4b006e;
    padding:12px;
}

td{
    padding:12px;
    text-align:center;
    border-bottom:1px solid #263554;
}

tr:hover{
    background:#1d2f50;
}

.gold{
    background:rgba(255,215,0,.15);
}

.silver{
    background:rgba(192,192,192,.15);
}

.bronze{
    background:rgba(205,127,50,.15);
}

.up{
    color:#00ff87;
    font-weight:bold;
}

.down{
    color:#ff6a6a;
    font-weight:bold;
}

.same{
    color:#ddd;
}

</style>

</head>

<body>

<div class="last-updated">
    <span>Last Updated</span>
    <div id="lastUpdatedTop">Loading...</div>
</div>

<header>
<h1 id="leagueName">
Loading...
</h1>
</header>

<div class="container">

<div class="cards">

<div class="card">
<h3>Current Leader</h3>
<div id="leader" class="big">-</div>
</div>

<div class="card">
<h3>Manager Of The Week</h3>
<div id="winner" class="big">-</div>
</div>

<div class="card">
<h3>Current GW</h3>
<div id="gw" class="big">-</div>
</div>

<div class="card">
<h3>Next Deadline</h3>
<div id="deadline"></div>
<div id="countdown"></div>
</div>

<div class="card">
<h3>League Members</h3>
<div id="members" class="big">-</div>
</div>

<div class="card">
<h3>Your Team</h3>
<div id="myTeam">-</div>
</div>

</div>

<h2>League Table</h2>

<table>

<thead>
<tr>
<th>Rank</th>
<th>Move</th>
<th>Team</th>
<th>Manager</th>
<th>GW</th>
<th>Total</th>
</tr>
</thead>

<tbody id="tableBody">

<tr>
<td colspan="6">
Loading...
</td>
</tr>

</tbody>

</table>

</div>

<script>

fetch("https://fpl-api.adhikarysamarth.workers.dev/")
.then(response => response.json())
.then(data => {

    const leagueData = data.league;
    const bootstrap = data.bootstrap;

    const teams =
        leagueData.standings.results;

    document.getElementById("leagueName")
        .innerText =
        leagueData.league.name;

    const leader = teams[0];

    document.getElementById("leader")
        .innerHTML =
        leader.entry_name +
        "<br><small>" +
        leader.total +
        " pts</small>";

    const winner = teams.reduce((a,b)=>
        a.event_total > b.event_total
        ? a
        : b
    );

    document.getElementById("winner")
        .innerHTML =
        winner.entry_name +
        "<br><small>" +
        winner.event_total +
        " pts</small>";

    document.getElementById("members")
        .innerText =
        teams.length;

    const currentGW =
        bootstrap.events.find(
            e => e.is_current
        );

    if(currentGW){

        document.getElementById("gw")
        .innerText =
        "GW " + currentGW.id;
    }

    const nextGW =
        bootstrap.events.find(
            e => e.is_next
        );

    if(nextGW){

        const deadlineDate =
            new Date(nextGW.deadline_time);

        document.getElementById("deadline")
        .innerText =
        deadlineDate.toLocaleString();

        function updateCountdown(){

            const now = new Date();

            const distance =
                deadlineDate - now;

            if(distance <= 0){

                document.getElementById(
                    "countdown"
                ).innerHTML =
                "⏰ Deadline Passed";

                return;
            }

            const days =
                Math.floor(distance/(1000*60*60*24));

            const hours =
                Math.floor((distance%(1000*60*60*24))
                /(1000*60*60));

            const minutes =
                Math.floor((distance%(1000*60*60))
                /(1000*60));

            const seconds =
                Math.floor((distance%(1000*60))
                /1000);

            document.getElementById(
                "countdown"
            ).innerHTML =
            `${days}d ${hours}h ${minutes}m ${seconds}s`;
        }

        updateCountdown();

        setInterval(updateCountdown,1000);
    }

    const lastUpdated =
        new Date(
            leagueData.last_updated_data
        ).toLocaleString();

    document.getElementById(
        "lastUpdatedTop"
    ).innerText =
    lastUpdated;

    const myTeam =
        teams.find(
            x => x.player_name ===
            "Samarth Adhikary"
        );

    if(myTeam){

        document.getElementById("myTeam")
        .innerHTML =
        "<strong>" +
        myTeam.entry_name +
        "</strong><br>Rank " +
        myTeam.rank +
        "<br>" +
        myTeam.total +
        " pts";
    }

    let rows = "";

    teams.forEach(team => {

        let move = "▬";
        let moveClass = "same";

        if(team.rank < team.last_rank){

            move = "▲";
            moveClass = "up";
        }

        if(team.rank > team.last_rank){

            move = "▼";
            moveClass = "down";
        }

        let rowClass = "";

        if(team.rank === 1)
            rowClass = "gold";

        if(team.rank === 2)
            rowClass = "silver";

        if(team.rank === 3)
            rowClass = "bronze";

        rows += `
        <tr class="${rowClass}">
            <td>${team.rank}</td>
            <td class="${moveClass}">
                ${move}
            </td>
            <td>${team.entry_name}</td>
            <td>${team.player_name}</td>
            <td>${team.event_total}</td>
            <td>${team.total}</td>
        </tr>
        `;
    });

    document.getElementById("tableBody")
        .innerHTML = rows;

})
.catch(error => {

    console.log(error);

    document.getElementById("tableBody")
        .innerHTML =
        `
        <tr>
            <td colspan="6">
            Error loading data
            </td>
        </tr>
        `;
});

</script>

</body>
</html>
