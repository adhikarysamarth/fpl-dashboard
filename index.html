<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sagarmatha League</title>

<style>

body{
    margin:0;
    font-family:Segoe UI,sans-serif;
    background:#0b1220;
    color:white;
}

header{
    background:linear-gradient(135deg,#37003c,#00ff87);
    padding:30px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:42px;
}

.container{
    padding:25px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:25px;
}

.card{
    background:#141d2f;
    border-radius:12px;
    padding:20px;
    box-shadow:0 4px 10px rgba(0,0,0,.4);
}

.card h3{
    margin-top:0;
    color:#00ff87;
}

.card-value{
    font-size:22px;
    font-weight:bold;
}

table{
    width:100%;
    border-collapse:collapse;
    background:#141d2f;
}

th{
    background:#37003c;
    color:white;
    padding:14px;
}

td{
    padding:12px;
    text-align:center;
    border-bottom:1px solid #23304d;
}

tr:hover{
    background:#1c2840;
}

.gold{
    background:rgba(255,215,0,.15);
}

.silver{
    background:rgba(192,192,192,.15);
}

.bronze{
    background:rgba(205,127,50,.15);
}

.up{
    color:#00ff87;
    font-weight:bold;
}

.down{
    color:#ff5858;
    font-weight:bold;
}

.same{
    color:#dddddd;
}

.loading{
    text-align:center;
    padding:50px;
}

</style>
</head>

<body>

<header>
    <h1 id="leagueName">Loading...</h1>
</header>

<div class="container">

<div class="cards">

    <div class="card">
        <h3>Current Leader</h3>
        <div class="card-value" id="leader">-</div>
    </div>

    <div class="card">
        <h3>Manager of the Week</h3>
        <div class="card-value" id="gwWinner">-</div>
    </div>

    <div class="card">
        <h3>League Members</h3>
        <div class="card-value" id="members">-</div>
    </div>

    <div class="card">
        <h3>Last Updated</h3>
        <div id="updated">-</div>
    </div>

    <div class="card">
        <h3>Your Team</h3>
        <div id="myTeam">-</div>
    </div>

</div>

<h2>League Table</h2>

<table>

<thead>
<tr>
    <th>#</th>
    <th>Move</th>
    <th>Team</th>
    <th>Manager</th>
    <th>GW Pts</th>
    <th>Total</th>
</tr>
</thead>

<tbody id="tableBody">
<tr>
    <td colspan="6" class="loading">Loading league data...</td>
</tr>
</tbody>

</table>

</div>

<script>

fetch("https://fpl-api.adhikarysamarth.workers.dev/")
.then(res => res.json())
.then(data => {

    console.log(data);

    const leagueData = data.league;
    const teams = leagueData.standings.results;

    document.getElementById("leagueName").innerText =
        leagueData.league.name;

    document.getElementById("leader").innerHTML =
        teams[0].entry_name + "<br>" +
        teams[0].total + " pts";

    document.getElementById("members").innerText =
        teams.length;

})
.catch(error => {

    console.error(error);

    alert(error);

});

</script>

</body>
</html>
